server.port=8080

# MySQL (AWS RDS)
app.mysql.instance=YOUR_AMAZON_DB_INSTANCE
app.mysql.port=3306
app.mysql.db-name=YOUR_DB_NAME
app.mysql.username=admin
app.mysql.password=YOUR_PASSWORD

# Redis - configure server with LRU eviction:
#   maxmemory 256mb
#   maxmemory-policy allkeys-lru
spring.redis.host=YOUR_REDIS_INSTANCE_IP
spring.redis.port=6379
spring.redis.password=YOUR_PASSWORD
# Command / connect timeouts (Lettuce). On timeout the app fails open to MySQL.
spring.redis.timeout=200ms
spring.redis.connect-timeout=200ms

# Simple circuit breaker: trip OPEN after N consecutive failures, then probe after cooldown.
# When OPEN, Redis calls are skipped and callers fall back to MySQL.
# ALERT lines are logged on trip (see RedisCircuitBreaker) for log-based paging.
app.redis.circuit-breaker.failure-threshold=5
app.redis.circuit-breaker.open-duration-ms=30000
app.redis.circuit-breaker.alert-cooldown-ms=60000

# L1 in-process cache in front of Redis. Fresh TTL is 60s; when Redis is down,
# stale entries are still served for another 10 minutes to avoid a MySQL stampede.
app.cache.l1.max-size=10000
app.cache.l1.ttl-ms=60000
app.cache.l1.stale-ms=600000
# Cap concurrent origin/MySQL loads per JVM while the Redis circuit is OPEN.
app.cache.mysql-fallback.max-concurrent=32

# External APIs
app.serpapi.key=YOUR_API_KEY
app.edenai.key=YOUR_API_KEY
app.geocoding.key=YOUR_API_KEY
